# =============================================================================
# Logstash Pipeline — Wazuh Alerts via Redis
# =============================================================================
# Flow: Redis (wazuh-alerts list) → Parse/Enrich → Elasticsearch
#
# The Redis input uses BRPOP internally: it blocks until data appears in the
# list, then pops atomically. There is NO ack mechanism — if Logstash crashes
# after popping an event but before indexing it, that event is lost. This is a
# known limitation of the Redis list approach (Redis Streams' consumer groups
# and XACK would solve this, but neither Filebeat nor Logstash support them).
# =============================================================================

input {
  redis {
    host => "${REDIS_HOST:host.docker.internal}"
    port => "${REDIS_PORT:6379}"
    password => "${REDIS_PASSWORD}"
    data_type => "list"
    key => "wazuh-alerts"
    codec => "json"

    # Number of events to return from Redis at a time. Higher values improve
    # throughput at the cost of memory. Default is 10.
    batch_count => 125
  }
}

filter {
  # ── Timestamp normalization ──────────────────────────────────────────────
  # Replace Logstash's ingest timestamp with Wazuh's actual event timestamp.
  # This ensures Kibana timelines show when events happened on the endpoint,
  # not when Logstash processed them.
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # ── Source tagging ───────────────────────────────────────────────────────
  # Tag every event with its origin pipeline. When you add CloudTrail or
  # other log sources later, each gets its own tag so Kibana dashboards can
  # filter per-source or show a unified "all events" view.
  if ![source_type] {
    mutate {
      add_field => { "source_type" => "wazuh" }
    }
  }

  # ── GeoIP enrichment ────────────────────────────────────────────────────
  # Adds geolocation data (country, city, lat/lon) to source IPs for map
  # visualizations in Kibana. Only runs when data.srcip exists. Private/
  # reserved IPs (10.x, 172.16.x, 192.168.x) will fail lookup silently.
  if [data][srcip] {
    geoip {
      source => "[data][srcip]"
      target => "[geoip]"
      tag_on_failure => ["_geoip_lookup_failed"]
    }
  }

  # ── Cleanup Filebeat envelope ────────────────────────────────────────────
  # Filebeat wraps the original alert with its own metadata (beat version,
  # input type, ECS fields, etc.). These are noise in the final index — the
  # useful context is already in Wazuh's own agent/manager/rule fields.
  #
  # [host] is intentionally KEPT — it identifies which Wazuh Manager host
  # the alert flowed through, useful in multi-manager deployments.
  mutate {
    remove_field => [
      "[beat]",
      "[input]",
      "[prospector]",
      "[ecs]",
      "[log]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ES_USER:elastic}"
    password => "${ES_PASSWORD}"
    index => "wazuh-alerts-%{+YYYY.MM.dd}"

    # Template management — Logstash auto-creates an index template.
    # For production, consider a custom template with explicit field mappings
    # (especially for data.srcip as ip type, rule.level as integer, etc.)
    manage_template => true
    template_name => "wazuh-alerts"
    template_overwrite => false
  }

  # ── Debug output ─────────────────────────────────────────────────────────
  # Uncomment to print processed events to Logstash container logs.
  # Useful for verifying the pipeline is working during initial setup.
  # WARNING: This logs every event — disable in production.
  #
  # stdout { codec => rubydebug }
}
